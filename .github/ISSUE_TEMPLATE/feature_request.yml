name: Feature request
description: Propose a capture, editor, or output behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem it solves
      description: What you are trying to communicate with the capture today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The interaction you want; keybinding ideas help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - capture
        - editor
        - output (clipboard/save/pin)
        - OCR
        - CLI / hotkeys
        - other
    validations:
      required: true
