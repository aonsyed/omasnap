version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci):"
  - package-ecosystem: devcontainers
    directory: /.devcontainer
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(devcontainer):"
