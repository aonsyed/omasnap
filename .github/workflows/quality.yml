name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Guards, complexity, duplication, docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format doxygen python3-pip
          pipx install lizard

      - name: Repository guards (todos, file budget, deps, flags, AGENTS.md)
        run: make guards

      - name: Enforce formatting on added files
        run: |
          base="${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}"
          # Newly added C++ files must be clang-format clean; modified
          # legacy files are reported (below) but not reformatted wholesale.
          mapfile -t added < <(git diff --name-only --diff-filter=A \
            "$base" -- 'src/*.cpp' 'src/*.hpp' 'src/*.mm' \
            'tests/*.cpp' 'tests/*.hpp' | grep -v '^$' || true)
          if (( ${#added[@]} > 0 )); then
            clang-format --dry-run --Werror "${added[@]}"
          else
            echo "format: no newly added C++ files"
          fi

      - name: Formatting advisory for modified files
        run: |
          base="${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD~1' }}"
          mapfile -t modified < <(git diff --name-only --diff-filter=M \
            "$base" -- 'src/*.cpp' 'src/*.hpp' 'src/*.mm' \
            'tests/*.cpp' 'tests/*.hpp' | grep -v '^$' || true)
          if (( ${#modified[@]} == 0 )); then
            echo "format advisory: no modified C++ files"
            exit 0
          fi
          clang-format --dry-run "${modified[@]}" 2>&1 | grep 'error:' | head -10 \
            || echo "format advisory: modified files are clean"

      - name: Cyclomatic complexity report
        run: |
          # Ratchet: the busiest editor handlers sit at CCN 127-129; the
          # ceiling catches new violations without failing legacy code.
          lizard src -l cpp -x '*/build/*' -T cyclomatic_complexity=130 \
            > complexity.txt || {
              tail -30 complexity.txt
              echo "complexity: functions above the CCN 130 ceiling (see report)"
              exit 1
            }
          tail -20 complexity.txt

      - name: Duplicate code report (PMD CPD)
        run: |
          curl -sL -o /tmp/pmd.zip \
            "https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.9.0/pmd-dist-7.9.0-bin.zip"
          unzip -q -o /tmp/pmd.zip -d /tmp/pmd-dist
          /tmp/pmd-dist/pmd-bin-7.9.0/bin/pmd cpd \
            --language cpp --minimum-tokens 200 --dir src --format xml \
            > cpd.xml || true
          python3 - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          blocks = len(ET.parse("cpd.xml").getroot().findall("duplication"))
          budget = 5
          print(f"duplicate blocks: {blocks} (budget {budget})")
          if blocks > budget:
              sys.exit(1)
          EOF

      - name: Generate API documentation
        run: make docs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_number }}
          path: |
            complexity.txt
            cpd.xml
            build/docs/html/
          if-no-files-found: ignore
